name: Soul Mesh CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/api/soul-mesh/**'
      - 'lib/soul-mesh/**'
      - 'lib/soul-core/**'
      - 'tsconfig.mesh.json'
      - '.github/workflows/soul-mesh-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck Soul Mesh
        run: pnpm exec tsc -p tsconfig.mesh.json --noEmit
      - name: Run canonical N06 processor tests
        run: pnpm exec tsx --test lib/soul-core/Nucleus06Processor.test.ts
      - name: Run N06 Mesh tests
        run: pnpm exec tsx --test lib/soul-mesh/N06Runtime.test.ts
      - name: Run legacy compatibility tests
        run: pnpm run test:nucleus05
