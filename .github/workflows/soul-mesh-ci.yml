name: Soul Mesh CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify lockfile is synchronized
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck Mesh adapter
        run: pnpm exec tsc -p tsconfig.mesh.json --noEmit
      - name: Run nucleus processor tests
        run: pnpm run test:nucleus05
      - name: Run N06 cognitive runtime tests
        run: pnpm run test:nucleus06
