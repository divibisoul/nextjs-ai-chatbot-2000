name: Soul Mesh CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Sync pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore(N06): synchronize pnpm lockfile [skip ci]"
          git push
      - run: pnpm install --frozen-lockfile
      - name: Typecheck Mesh adapter
        run: pnpm exec tsc -p tsconfig.mesh.json --noEmit
      - name: Run nucleus processor tests
        run: pnpm run test:nucleus05
      - name: Run N06 cognitive runtime tests
        run: pnpm run test:nucleus06
