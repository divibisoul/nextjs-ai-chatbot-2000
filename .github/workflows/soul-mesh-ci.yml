name: Soul Mesh CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n06-soul-mesh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify immutable lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck Mesh adapter
        run: pnpm exec tsc -p tsconfig.mesh.json --noEmit
      - name: Run nucleus processor tests
        run: pnpm run test:nucleus05
      - name: Run N06 cognitive runtime and authority tests
        run: pnpm run test:nucleus06
      - name: Emit N06 authority evidence
        run: test -s N06-AUTHORITY-INTEGRITY.json
