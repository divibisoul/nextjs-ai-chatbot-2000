name: Soul Mesh CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n06-soul-mesh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reconcile deterministic lockfile on the canonical PR branch
        if: github.event_name == 'pull_request'
        run: |
          pnpm install --lockfile-only --ignore-scripts
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(n06): synchronize pnpm lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Verify immutable lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck Mesh adapter
        run: pnpm exec tsc -p tsconfig.mesh.json --noEmit
      - name: Run nucleus processor tests
        run: pnpm run test:nucleus05
      - name: Run N06 cognitive runtime and authority tests
        run: pnpm run test:nucleus06
      - name: Emit N06 authority evidence
        run: test -s N06-AUTHORITY-INTEGRITY.json
